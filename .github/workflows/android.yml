

name: Build PAK Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*PAK-Scanner-Android-Complete*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "PAK Scanner project ZIP not found"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          test -f project/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAK-Scanner-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
