
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract ZIP and find project
        shell: bash
        run: |
          set -e
          echo "Repository files:"
          find . -maxdepth 3 -type f | head -100

          ZIP=$(find . -type f -name '*.zip' \
            -not -path '*/.git/*' | head -1)

          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
          fi

          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.git/*' | head -1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: ZIP does not contain gradlew."
            echo "A real Android Gradle project and wrapper are needed."
            exit 1
          fi

          echo "Project wrapper found: $WRAPPER"
          chmod +x "$WRAPPER"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pak-Scanner-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
