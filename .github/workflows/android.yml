
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Pak Scanner APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Gradle wrapper..."
          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew file not found."
            echo "Check that your Android project ZIP was extracted into the repository."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pak-scanner-apk"
          find . -type f -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} "$RUNNER_TEMP/pak-scanner-apk/" \;
          if [ -z "$(ls -A "$RUNNER_TEMP/pak-scanner-apk")" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pak-Scanner-APK
          path: ${{ runner.temp }}/pak-scanner-apk/*.apk
          if-no-files-found: error
